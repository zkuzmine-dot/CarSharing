[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carsharing-seminar"
version = "0.1.0"
description = "Imperative OOP car-sharing application for a functional programming seminar"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "freezegun>=1.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
files = ["carsharing"]
strict = true

[tool.setuptools]
packages = ["carsharing"]
